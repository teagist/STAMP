<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STAMP – My Schedule</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FullCalendar CSS -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/main.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    #calendar {
      max-width: 900px;
      margin: 40px auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark" style="background-color: #800000">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="#">Student/Tutor Appointment Management Program(Admin)</a>
      <a class="btn btn-outline-light" href="index.html">Log Out</a>
    </div>
  </nav>

  <div class="container text-center my-4">
    <h2>My Monthly Schedule</h2>
  </div>
  <div id="calendar"></div>

  <footer class="bg-dark text-white text-center py-3 mt-5">
    © 2026 TTM Co. | All Rights Reserved
  </footer>

  <!-- Bootstrap + FullCalendar Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var calendarEl = document.getElementById('calendar');
      var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: ''
        },
        events: [
          { title: 'Math Class', start: '2025-10-02', color: '#0d6efd' },
          { title: 'English Tutor', start: '2025-10-06', color: '#198754' },
          { title: 'Physics Lab', start: '2025-10-10', color: '#ffc107', textColor: 'black' },
          { title: 'Study Group', start: '2025-10-13', color: '#dc3545' },
          { title: 'Chemistry Exam', start: '2025-10-20', color: '#6f42c1' }
        ]
      });
      calendar.render();
    });
  </script>
</body>
</html>
